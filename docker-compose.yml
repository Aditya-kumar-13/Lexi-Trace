services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      LEXITRACE_DATABASE_URL: sqlite:////data/lexitrace.db
      LEXITRACE_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      LEXITRACE_SEMANTIC_ENABLED: "true"
      LEXITRACE_SEMANTIC_MODEL: BAAI/bge-small-en-v1.5
      LEXITRACE_SEMANTIC_CACHE_DIR: /data/models
    ports:
      - "8000:8000"
    volumes:
      - lexitrace-data:/data

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  lexitrace-data:
