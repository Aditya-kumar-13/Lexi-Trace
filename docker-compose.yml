services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      LEXITRACE_DATABASE_URL: sqlite:////data/lexitrace.db
      LEXITRACE_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - lexitrace-data:/data

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  lexitrace-data:
