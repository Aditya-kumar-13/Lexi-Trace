[project]
name = "lexitrace"
version = "0.5.0"
description = "Local-first personal word memory for Kivi"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "jellyfish>=1.1,<2",
  "pydantic>=2.9,<3",
  "rapidfuzz>=3.10,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
semantic = [
  "fastembed>=0.8,<0.9",
]
dev = [
  "httpx>=0.27,<1",
  "hypothesis>=6.120,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
markers = ["evaluation: reproducible benchmark checks"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/lexitrace"]

[tool.hatch.build.targets.wheel.force-include]
"apps/api/lexitrace/policy.toml" = "lexitrace/policy.toml"
